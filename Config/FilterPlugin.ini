[FilterPlugin]
; BuildPlugin's default filter includes native build products and Source, but the
; runtime bootstrap also needs managed tool assemblies, projects and build scripts.
/Binaries/Managed/Automation/...
/Binaries/Managed/netstandard2.0/...
/Build/Scripts/...
/Config/...
/Managed/...
/Templates/...
/Directory.Packages.props
/UnrealSharp*.props
/UnrealSharp.sln
/README.md
/LICENSE

; Runtime assemblies are built on first use in a writable user cache. Ship the
; matching generated inputs and their content identity, not runtime DLLs.
/Intermediate/UnrealSharp/UHT/.../*.cs
/Intermediate/UnrealSharp/UHT/.../UE5Rules.Defines.props
/Intermediate/UnrealSharp/UHT/.../Runtime.id

; Installed engines load precompiled automation commands from this plugin-local record.
/Intermediate/ScriptModules/UnrealSharp.Automation.json

; Keep local managed build caches out of the distributed plugin.
-/Build/Scripts/bin/...
-/Build/Scripts/obj/...
-/Build/Scripts/uatbin/...
-/Build/Scripts/uatobj/...
-/Managed/.../bin/...
-/Managed/.../obj/...
-/Source/UnrealSharpManagedGlue/bin/...
-/Source/UnrealSharpManagedGlue/obj/...

; UBT loads the precompiled UHT exporter from this project-relative output path.
; Include the exporter and its managed dependencies, without intermediate caches.
/Source/UnrealSharpManagedGlue/bin/.../*.dll
/Source/UnrealSharpManagedGlue/bin/.../*.deps.json

; SDK-style managed projects use Roslyn's NetCore build host. The legacy
; .NET Framework host contains an executable that cannot be included on Fab.
-/Binaries/Managed/.../BuildHost-net472/...
-/Binaries/Managed/.../UnrealSharp.GlueGenerator.Tests.*
